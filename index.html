<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genochemy（コピー）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:"Zen Maru Gothic",sans-serif;color:#222;}
  button,select{font-family:inherit;}
  img{max-width:none;}

  .topbar{
    height:42px; display:flex; align-items:center; gap:10px; padding:0 14px;
    border-bottom:1px solid #aaa; background:#fff;
  }
  .topbar img{height:24px;}
  .topbar .ttl{font-weight:700; font-size:15px;}
  .topbar .sub{font-size:11px; color:#777; flex:1;}
  .topbar a{font-size:11px; color:#0066cc; text-decoration:none; white-space:nowrap;}
  .topbar a:hover{text-decoration:underline;}

  main{height:calc(100% - 42px); display:flex; touch-action:none;}
  .left{flex:1; display:flex; flex-direction:column; min-width:0;}
  .right{width:0; height:100%; display:flex; flex-direction:column; position:relative; overflow:hidden; transition:width .22s ease; background:#fff; flex-shrink:0;}
  .right.show{width:500px;}
  @media (max-width:820px){ .right.show{width:100vw; position:fixed; top:42px; right:0; height:calc(100% - 42px); z-index:40; box-shadow:-6px 0 20px rgba(0,0,0,.2);} }

  /* ---------- Preview panel (always visible, ~1/4 width) ---------- */
  .preview{
    width:26%; min-width:240px; max-width:380px; flex-shrink:0; height:100%;
    display:flex; flex-direction:column; gap:10px; padding:14px;
    border-left:1px solid #aaa; border-right:1px solid #ddd; background:#fff; overflow-y:auto;
  }
  @media (max-width:1000px){ .preview{width:230px; min-width:200px;} }
  @media (max-width:760px){ .preview{display:none;} }
  .preview h2{margin:0; font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:6px;}
  .preview h2 .dot{width:8px; height:8px; border-radius:50%; background:#1de9b6; flex-shrink:0;}
  .preview-stage{
    background:radial-gradient(ellipse at 50% 30%, #eafaf5, #dff3ee 70%); border:1px solid #ddd;
    border-radius:12px; height:150px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .preview-bact{height:100px; transition:filter .4s;}
  .preview-status{font-size:12px; color:#555; line-height:1.6; min-height:2.6em;}
  .preview-status.ok{color:#0b7c4d; font-weight:700;}
  .preview-status.warn{color:#b45309; font-weight:700;}
  .preview-chips{display:flex; flex-wrap:wrap; gap:6px;}
  .preview-chip{background:#f2f2f2; border-radius:8px; padding:4px 9px; font-size:11px; border:1px solid #e2e2e2; white-space:nowrap;}
  .preview h3{margin:4px 0 0; font-size:11.5px; color:#888; font-weight:700;}

  /* ---------- Lab toggle strip (in-flow, always clickable) ---------- */
  .lab-strip{width:38px; flex-shrink:0; height:100%; display:flex; align-items:center; justify-content:center; border-left:1px solid #aaa; background:#f2f2f2;}
  .lab-toggle-btn{
    writing-mode:vertical-rl; text-orientation:mixed; border:1px solid #aaa; background:#fff; border-radius:8px;
    padding:12px 6px; font-size:12px; font-weight:700; cursor:pointer; letter-spacing:.05em;
  }
  .lab-toggle-btn:hover{background:#f5fffd;}

  .program{flex:1; position:relative; overflow:hidden; background:#fcfcfa;}
  .program.running{border:5px solid #1de9b6; box-sizing:border-box;}
  .program-hint{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; color:#aaa; font-size:14px; padding:30px; pointer-events:none; line-height:2;
  }
  .program-hint b{color:#777;}

  .run-wrap{position:absolute; bottom:14px; right:16px; z-index:5; display:flex; align-items:center; gap:10px;}
  .run-btn{
    display:flex; align-items:center; gap:8px; background:#fff; border:2px solid #333; border-radius:30px;
    padding:10px 22px 10px 18px; font-weight:700; font-size:15px; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,.15);
  }
  .run-btn .tri{width:0;height:0;border-style:solid;border-width:8px 0 8px 13px;border-color:transparent transparent transparent #1de9b6;}
  .run-btn:hover{background:#f5fffd;}
  .run-status{font-size:12px; color:#666; background:#fff; padding:4px 10px; border-radius:8px; border:1px solid #ddd;}

  .tray{height:200px; position:relative; border-top:1px solid #aaa; background:#fafafa; flex-shrink:0;}
  .tray-inner{width:100%; height:100%; overflow-y:auto; overflow-x:auto; display:flex; flex-wrap:wrap; align-items:flex-end; gap:18px; padding:10px; box-sizing:border-box;}
  .tray.drag-over{background:#ffe3e3;}

  .blk{position:relative; touch-action:none; user-select:none; cursor:grab;}
  .blk:active{cursor:grabbing;}
  .blk img{display:block; pointer-events:none; -webkit-user-drag:none;}
  .blk-label{
    position:absolute; left:0; width:100%; height:30px; bottom:0;
    display:flex; align-items:center; justify-content:center; text-align:center;
    color:#fff; font-size:11px; font-weight:700; padding:0 16px; pointer-events:none;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 2px rgba(0,0,0,.35);
  }
  .tray .blk{margin-bottom:0;}
  .tray-item-wrap{display:flex; flex-direction:column; align-items:center; gap:4px;}
  .tray-item-name{font-size:11px; color:#555; max-width:150px; text-align:center; line-height:1.3;}

  #canvasBlocks{position:absolute; inset:0;}
  .placed{position:absolute; top:0; left:0; z-index:1;}
  .placed.dragging{z-index:80; filter:drop-shadow(0 10px 14px rgba(0,0,0,.35));}
  .placed.snap-target img{filter:drop-shadow(0 0 0 3px #ffd166) drop-shadow(0 0 6px #ffd166);}

  .tooltip{
    position:fixed; background:#fff; border-radius:10px; border:1px solid #aaa; max-width:280px;
    padding:10px 12px; box-sizing:border-box; z-index:200; font-size:12.5px; line-height:1.6;
    box-shadow:0 8px 22px rgba(0,0,0,.18); pointer-events:none;
  }
  .tooltip h3{margin:0 0 4px 0; font-size:13.5px;}

  /* ---------- Runner / Lab ---------- */
  .runner{height:300px; flex-shrink:0; border-bottom:1px solid #aaa; display:flex; align-items:center; justify-content:center; position:relative; user-select:none; background:radial-gradient(ellipse at 50% 30%, #eafaf5, #dff3ee 70%);}
  .bacterium{height:190px; position:relative; z-index:2; transition:filter .4s;}
  .light-effect{position:absolute; top:6px; left:50%; transform:translateX(-50%); height:280px; opacity:.55; pointer-events:none; z-index:1;}
  .stage-settings{position:absolute; inset:0; pointer-events:none;}
  .gui{position:absolute; bottom:8px; left:0; width:100%; padding:0 12px; box-sizing:border-box; pointer-events:none;}
  .drug-a{display:flex; align-items:center; gap:8px; background:#ffffffcc; border:1px solid #aaa; border-radius:20px; padding:5px 12px; margin-bottom:6px; pointer-events:all; font-size:12px;}
  .drug-a input{flex:1;}
  .drug-a .val{min-width:26px; text-align:right; font-weight:700;}
  .light-switches{display:flex; gap:8px; pointer-events:all;}
  .light-switch{
    flex:1; border:1px solid #aaa; background:#ffffffcc; border-radius:20px; padding:6px 8px; font-size:11.5px;
    font-weight:700; cursor:pointer;
  }
  .light-switch.on.blue{background:#4c97ff; color:#fff; border-color:#2a5fb8;}
  .light-switch.on.red{background:#ff6680; color:#fff; border-color:#b8324a;}

  /* ---------- Tabs ---------- */
  .tabs{display:flex; align-items:flex-end; padding:6px 8px 0; border-bottom:1px solid #aaa; background:#f2f2f2; gap:2px;}
  .tab-item{padding:7px 13px; border:1px solid #aaa; border-bottom:none; border-radius:9px 9px 0 0; cursor:pointer; font-size:12.5px; font-weight:700; background:#e6e6e6; color:#666; position:relative; top:1px;}
  .tab-item.active{background:#fff; color:#111; border-bottom:1px solid #fff;}
  .tabs-right{flex:1;}

  .tabs-container{flex:1; display:flex; flex-direction:column; overflow:hidden;}
  .tab-content{flex:1; padding:14px; overflow-y:auto; font-size:13px; line-height:1.85;}

  .tut-nav{display:flex; align-items:center; justify-content:space-between; margin-top:14px;}
  .tut-nav button{background:#fff; border:1px solid #aaa; padding:8px 16px; border-radius:10px; cursor:pointer; font-family:inherit; font-weight:700;}
  .tut-nav button:disabled{color:#ccc; cursor:default;}
  .tut-page{font-size:12px; color:#888;}

  .split{display:flex; align-items:stretch; height:100%; gap:10px;}
  .listbox{border:1px solid #aaa; width:150px; flex-shrink:0; overflow-y:auto; border-radius:6px;}
  .listbox-item{padding:8px 10px; cursor:pointer; font-size:12.5px; border-bottom:1px solid #eee;}
  .listbox-item.active{background:#cfece3;}
  .settings-pane{flex:1; overflow-y:auto; min-width:0;}
  .settings-pane h3{margin:0 0 6px;}
  .settings-pane .desc{color:#666; font-size:12px; margin-bottom:10px;}
  .empty-note{color:#999; font-size:12.5px; padding:14px 4px;}

  .q-list{list-style:none; margin:0; padding:0;}
  .q-list li{padding:9px 4px; border-bottom:1px solid #eee; font-size:13px; display:flex; align-items:center; gap:8px;}
  .q-num{background:#eee; border-radius:50%; width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0;}

  .load-btn{background:#fff; border:1px solid #aaa; padding:12px 18px; border-radius:10px; font-weight:700; cursor:pointer; font-family:inherit; font-size:13px;}
  .load-btn:hover{background:#f2fffb;}

  svg.chart{width:100%; height:110px; margin-top:6px;}

  /* ---------- MD (Brownian dynamics) particle simulation ---------- */
  .md-wrap{display:flex; flex-direction:column; gap:10px;}
  .md-desc{color:#666; font-size:12px; line-height:1.7;}
  .md-canvas-shell{position:relative; border-radius:10px; overflow:hidden; background:#0d1f1a;}
  #mdCanvas{width:100%; height:auto; display:block;}
  .md-dead-overlay{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column;
    background:rgba(20,10,10,.55); color:#ffb4b4; font-size:20px; font-weight:700; text-align:center; gap:6px;
  }
  .md-dead-overlay small{font-size:11px; font-weight:400; color:#ffd6d6;}
  .md-controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .md-controls button{background:#fff; border:1px solid #aaa; border-radius:9px; padding:7px 14px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit;}
  .md-controls button:hover{background:#f2fffb;}
  .md-status{font-size:11.5px; color:#888;}
  .md-legend{display:flex; flex-wrap:wrap; gap:10px 16px; font-size:11.5px; color:#555;}
  .md-legend span{display:inline-flex; align-items:center; gap:5px;}
  .md-legend i{width:9px; height:9px; border-radius:50%; display:inline-block; flex-shrink:0;}

  /* ---------- 3D protein MD (coarse-grained Go-model, Three.js) ---------- */
  .md-mode-toggle{display:flex; gap:6px; margin-bottom:2px;}
  .md-mode-btn{background:#f2f2f2; border:1px solid #aaa; border-radius:9px; padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; color:#666;}
  .md-mode-btn.active{background:#0f231d; color:#fff; border-color:#0f231d;}
  .p3d-shell{position:relative; border-radius:10px; overflow:hidden; background:#0a1512;}
  .p3d-mount{width:100%; aspect-ratio:560/380; touch-action:none; cursor:grab;}
  .p3d-mount:active{cursor:grabbing;}
  .p3d-mount canvas{display:block; width:100% !important; height:100% !important;}
  .p3d-hint{position:absolute; bottom:8px; left:10px; font-size:10.5px; color:#9fd8c4; opacity:.85;}
  .p3d-controls{display:flex; flex-wrap:wrap; align-items:center; gap:14px;}
  .p3d-row{display:flex; align-items:center; gap:8px; font-size:12px;}
  .p3d-row input[type=range]{width:140px;}
  .p3d-readouts{display:flex; gap:10px; flex-wrap:wrap;}
  .p3d-readouts .chip{background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:5px 10px; font-size:11.5px; font-weight:700; color:var(--ink-soft);}
  .p3d-protein-select{display:flex; gap:6px; flex-wrap:wrap;}
  .p3d-protein-select button{border:1px solid #aaa; background:#fff; border-radius:8px; padding:6px 11px; font-size:11.5px; font-weight:700; cursor:pointer; font-family:inherit;}
  .p3d-protein-select button.active{background:var(--bc,#274690); color:#fff; border-color:transparent;}
  .p3d-note{font-size:11px; color:#999; line-height:1.7;}
</style>
</head>

  // ---------- Tooltip ----------
  function showTooltip(el, part){
    tooltip.innerHTML = '<h3>' + part.label + '</h3>' + part.desc;
    tooltip.hidden = false;
    const r = el.getBoundingClientRect();
    let left = r.left, top = r.bottom + 8;
    if (left + 280 > window.innerWidth) left = window.innerWidth - 290;
    if (top + 100 > window.innerHeight) top = r.top - 100;
    tooltip.style.left = Math.max(6, left) + 'px';
    tooltip.style.top = Math.max(6, top) + 'px';
  }
  function hideTooltip(){ tooltip.hidden = true; }

  // ---------- Palette (tray) ----------
  PARTS.forEach(part => {
    const shape = SHAPES[part.shape];
    const wrap = document.createElement('div');
    wrap.className = 'tray-item-wrap';
    const blk = document.createElement('div');
    blk.className = 'blk';
    blk.dataset.partId = part.id;
    blk.style.width = shape.w + 'px';
    blk.style.height = shape.h + 'px';
    const img = document.createElement('img');
    img.src = IMG[part.shape];
    img.width = shape.w; img.height = shape.h;
    img.draggable = false;
    blk.appendChild(img);
    if (part.shape !== 'seqrecomb') {
      const lbl = document.createElement('div');
      lbl.className = 'blk-label';
      lbl.textContent = part.short;
      blk.appendChild(lbl);
    }
    wrap.appendChild(blk);
    const name = document.createElement('div');
    name.className = 'tray-item-name';
    name.textContent = part.label;
    wrap.appendChild(name);
    tray.appendChild(wrap);

    blk.addEventListener('pointerenter', () => showTooltip(blk, part));
    blk.addEventListener('pointerleave', hideTooltip);
  });

  // ---------- Block / drag engine ----------
  const blocks = new Map();
  let seq = 0, zTop = 1, dragState = null;

  function render(b){
    b.el.style.left = b.x + 'px';
    b.el.style.top = (b.connY + b.barOffset - b.h) + 'px';
  }

  function updateHint(){ programHint.style.display = blocks.size ? 'none' : 'flex'; }

  function createPlaced(partId, x, connY){
    const part = PART_BY_ID[partId];
    const shape = SHAPES[part.shape];
    const id = 'p' + (seq++);
    const el = document.createElement('div');
    el.className = 'placed blk';
    el.style.width = shape.w + 'px';
    el.style.height = shape.h + 'px';
    const img = document.createElement('img');
    img.src = IMG[part.shape];
    img.width = shape.w; img.height = shape.h;
    img.draggable = false;
    el.appendChild(img);
    if (part.shape !== 'seqrecomb') {
      const lbl = document.createElement('div');
      lbl.className = 'blk-label';
      lbl.textContent = part.short;
      el.appendChild(lbl);
    }
    el.dataset.id = id;
    canvasBlocks.appendChild(el);
    const b = { id, partId, part, el, x, connY, w:shape.w, h:shape.h, barOffset:shape.barOffset, next:null, prev:null };
    blocks.set(id, b);
    render(b);
    updateHint();
    el.addEventListener('pointerenter', () => { if (!dragState) showTooltip(el, part); });
    el.addEventListener('pointerleave', hideTooltip);
    return b;
  }

  function positionGroup(group, headX, headConnY){
    headX = Math.max(4, headX);
    headConnY = Math.max(20, Math.min(headConnY, program.clientHeight - 20));
    let prev = null;
    group.forEach((id, i) => {
      const b = blocks.get(id);
      if (i === 0) { b.x = headX; b.connY = headConnY; }
      else { b.x = prev.x + prev.w - TAB_OVERLAP; b.connY = headConnY; }
      render(b);
      prev = b;
    });
  }

  function findSnapTarget(group, headX, headConnY){
    let best = null, bestDist = Infinity;
    blocks.forEach(t => {
      if (group.includes(t.id) || t.next) return;
      const cx = t.x + t.w - TAB_OVERLAP, cy = t.connY;
      const d = Math.hypot(headX - cx, headConnY - cy);
      if (d < 60 && d < bestDist) { bestDist = d; best = t; }
    });
    return best;
  }

  function bringToFront(group){ group.forEach(id => { blocks.get(id).el.style.zIndex = ++zTop; }); }

  function beginDrag(e, group, offsetX, offsetY){
    hideTooltip();
    dragState = { group, offsetX, offsetY, lastHighlight: null };
    group.forEach(id => blocks.get(id).el.classList.add('dragging'));
    bringToFront(group);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
  }

  function onPointerMove(e){
    if (!dragState) return;
    const rect = program.getBoundingClientRect();
    const headX = (e.clientX - rect.left) - dragState.offsetX;
    const headConnY = (e.clientY - rect.top) - dragState.offsetY;
    positionGroup(dragState.group, headX, headConnY);
    if (dragState.lastHighlight) dragState.lastHighlight.el.classList.remove('snap-target');
    const target = findSnapTarget(dragState.group, headX, headConnY);
    if (target) target.el.classList.add('snap-target');
    dragState.lastHighlight = target;

    const trayRect = trayWrap.getBoundingClientRect();
    const overTray = e.clientY >= trayRect.top;
    trayWrap.classList.toggle('drag-over', overTray);
  }

  function onPointerUp(e){
    if (!dragState) return;
    const { group } = dragState;
    const rect = program.getBoundingClientRect();
    const headX = (e.clientX - rect.left) - dragState.offsetX;
    const headConnY = (e.clientY - rect.top) - dragState.offsetY;
    const trayRect = trayWrap.getBoundingClientRect();
    const overTray = e.clientY >= trayRect.top;

    if (overTray) {
      deleteGroup(group);
    } else {
      const target = findSnapTarget(group, headX, headConnY);
      if (target) {
        const head = blocks.get(group[0]);
        target.next = head.id;
        head.prev = target.id;
        positionGroup(group, target.x + target.w - TAB_OVERLAP, target.connY);
      }
    }

    if (dragState.lastHighlight) dragState.lastHighlight.el.classList.remove('snap-target');
    trayWrap.classList.remove('drag-over');
    group.forEach(id => { const b = blocks.get(id); if (b) b.el.classList.remove('dragging'); });

    window.removeEventListener('pointermove', onPointerMove);
    window.removeEventListener('pointerup', onPointerUp);
    dragState = null;
    updateHint();
  }

  function deleteGroup(group){
    const head = blocks.get(group[0]);
    if (head && head.prev) { const p = blocks.get(head.prev); if (p) p.next = null; }
    group.forEach(id => { const b = blocks.get(id); if (b) { b.el.remove(); blocks.delete(id); } });
  }

  tray.addEventListener('pointerdown', e => {
    const item = e.target.closest('.blk');
    if (!item) return;
    e.preventDefault();
    hideTooltip();
    const part = PART_BY_ID[item.dataset.partId];
    const shape = SHAPES[part.shape];
    const rect = program.getBoundingClientRect();
    const x = (e.clientX - rect.left) - shape.w / 2;
    const connY = (e.clientY - rect.top);
    const b = createPlaced(part.id, x, connY);
    beginDrag(e, [b.id], shape.w / 2, 0);
  });

  canvasBlocks.addEventListener('pointerdown', e => {
    const el = e.target.closest('.placed');
    if (!el) return;
    e.preventDefault();
    const b = blocks.get(el.dataset.id);
    if (!b) return;
    if (b.prev) { const p = blocks.get(b.prev); if (p) p.next = null; b.prev = null; }
    const group = [];
    let cur = b;
    while (cur) { group.push(cur.id); cur = cur.next ? blocks.get(cur.next) : null; }
    const rect = program.getBoundingClientRect();
    const offsetX = (e.clientX - rect.left) - b.x;
    const offsetY = (e.clientY - rect.top) - b.connY;
    beginDrag(e, group, offsetX, offsetY);
  });

  // ---------- Simulation ----------
  function walkChain(head){
    const seqArr = [];
    let cur = head;
    while (cur) { seqArr.push(cur); cur = cur.next ? blocks.get(cur.next) : null; }
    return seqArr;
  }

  function eulerRun(k_tx, eff, genes){
    const dt = 0.05, steps = 400, sampleEvery = 10;
    let M = 0;
    const proteins = genes.map(() => ({ P: 0, arr: [] }));
    const mArr = [];
    for (let i = 0; i <= steps; i++) {
      if (i % sampleEvery === 0) {
        mArr.push(M);
        proteins.forEach(pr => pr.arr.push(pr.P));
      }
      const dM = (k_tx * eff) - DECAY_M * M;
      M += dM * dt;
      proteins.forEach(pr => {
        const dP = K_TL * M - DECAY_P * pr.P;
        pr.P += dP * dt;
      });
    }
    const Mss = (k_tx * eff) / DECAY_M;
    const Pss = (K_TL * Mss) / DECAY_P;
    return { mArr, proteins, Mss, Pss };
  }

  function analyze(){
    const heads = [...blocks.values()].filter(b => !b.prev);
    const chainsRaw = heads.map(walkChain).filter(seqArr => seqArr[0].part.cat === 'promoter');

    // pass 1: regulator supply — treat promRepressor as unrepressed, promActivator as OFF (first-order approx)
    let repressorSupply = 0, activatorSupply = 0;
    const provisional = chainsRaw.map(seqArr => {
      const promPart = seqArr[0].part;
      const genes = seqArr.filter(b => b.part.cat === 'gene');
      const lastB = seqArr[seqArr.length - 1];
      const eff = lastB.part.kind === 'terminator' ? 0.95 : 0.3;
      let k_tx_base;
      if (promPart.kind === 'prom-const') k_tx_base = 1.5;
      else if (promPart.kind === 'prom-repressor') k_tx_base = 1.5; // provisional: unrepressed
      else k_tx_base = 0; // prom-activator provisional: off
      return { seqArr, promPart, genes, eff, k_tx_base };
    });
    provisional.forEach(c => {
      const sim = eulerRun(c.k_tx_base, c.eff, c.genes);
      c.genes.forEach((g, i) => {
        if (g.part.kind === 'gene-repressor') repressorSupply += sim.proteins[i].P;
        if (g.part.kind === 'gene-activator') activatorSupply += sim.proteins[i].P;
      });
    });

    // pass 2: final k_tx using regulator levels, then real per-chain simulation
    const K = 2, N = 2;
    const results = provisional.map(c => {
      let k_tx;
      if (c.promPart.kind === 'prom-const') k_tx = 1.5;
      else if (c.promPart.kind === 'prom-repressor') k_tx = 1.5 / (1 + Math.pow(repressorSupply / K, N));
      else k_tx = 1.5 * (Math.pow(activatorSupply, N) / (Math.pow(K, N) + Math.pow(activatorSupply, N)));
      const sim = eulerRun(k_tx, c.eff, c.genes);
      const warn = c.seqArr[c.seqArr.length - 1].part.kind !== 'terminator'
        ? 'ターミネーターが無いため転写が終わらず、発現が不安定です。' : null;
      return {
        promLabel: c.promPart.label,
        promKind: c.promPart.kind,
        genes: c.genes.map((g, i) => ({
          part: g.part, Pss: sim.proteins[i].P, arr: sim.proteins[i].arr
        })),
        mRNAName: c.genes.map(g => g.part.label).join(' + ') || '(遺伝子なし)',
        mArr: sim.mArr, Mss: sim.Mss, k_tx, eff: c.eff, warn
      };
    });
    return results;
  }

  let lastResults = [];

  function svgChart(arrList, colors){
    const W = 280, H = 100, PAD = 6;
    let max = 1;
    arrList.forEach(a => { a.forEach(v => { if (v > max) max = v; }); });
    let svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">';
    svg += '<line x1="0" y1="' + (H - PAD) + '" x2="' + W + '" y2="' + (H - PAD) + '" stroke="#ddd"/>';
    arrList.forEach((arr, idx) => {
      const n = arr.length - 1;
      const pts = arr.map((v, i) => (i / n * W).toFixed(1) + ',' + (H - PAD - (v / max) * (H - PAD * 2)).toFixed(1)).join(' ');
      svg += '<polyline points="' + pts + '" fill="none" stroke="' + colors[idx] + '" stroke-width="2.5"/>';
    });
    svg += '</svg>';
    return svg;
  }

  function runSimulation(){
    program.classList.add('running');
    runStatus.style.display = 'inline-block';
    runStatus.textContent = 'シミュレーション中…';
    setTimeout(() => {
      program.classList.remove('running');
      lastResults = analyze();
      applyGenomyState(lastResults);
      renderPreview(lastResults);
      initMDParticles(lastResults);
      refreshActiveTab();
      runStatus.textContent = lastResults.length ? '実行完了（' + lastResults.length + '回路）' : '回路が組まれていません';
    }, 650);
  }
  runBtn.addEventListener('click', runSimulation);

  function setBacteriumVisual(img, totalKill, totalGFP){
    if (totalKill > 1.2) {
      img.src = KILLED_IMG;
      img.style.filter = 'none';

      img.src = BACT_IMG;
      const glow = Math.min(totalGFP / 6, 1);

        ? 'drop-shadow(0 0 ' + (6 + 22 * glow) + 'px rgba(105,240,174,' + (0.5 + 0.4 * glow) + ')) saturate(' + (1 + glow) + ') hue-rotate(' + (60 * glow) + 'deg) brightness(' + (1 + 0.15*glow) + ')'
        : 'none';
    }
  }

  function applyGenomyState(results){
    let totalGFP = 0, totalKill = 0;
    results.forEach(r => r.genes.forEach(g => {
      if (g.part.kind === 'gene-visible') totalGFP += g.Pss;
      if (g.part.kind === 'gene-kill') totalKill += g.Pss;
    }));
    setBacteriumVisual(bacteriumImg, totalKill, totalGFP);
  }

  const CHART_PALETTE = ['#4c97ff', '#69f0ae', '#f9a825', '#ff6680', '#9966ff', '#00bcd4'];

  function renderPreview(results){
    let totalGFP = 0, totalKill = 0;
    const items = [];
    results.forEach((r, ci) => r.genes.forEach((g, gi) => items.push({ part: g.part, Pss: g.Pss, arr: g.arr })));
    items.forEach(it => {
      if (it.part.kind === 'gene-visible') totalGFP += it.Pss;
      if (it.part.kind === 'gene-kill') totalKill += it.Pss;
    });
    setBacteriumVisual(previewBacterium, totalKill, totalGFP);

    if (results.length === 0) {
      previewStatus.className = 'preview-status';
      previewStatus.textContent = '回路を組んで「実行」を押すと、ここに結果が表示されます。';
      previewChips.innerHTML = '';
      previewChartWrap.innerHTML = '';
      return;
    }
    if (totalKill > 1.2) {
      previewStatus.className = 'preview-status warn';
      previewStatus.textContent = '💀 キルスイッチが作動し、Genomyは死滅しました。';
    } else if (totalGFP > 0.1) {
      previewStatus.className = 'preview-status ok';
      previewStatus.textContent = '✅ GFPが発現し、Genomyが発光しています（発現量 ≈ ' + totalGFP.toFixed(2) + '）。';
    } else if (items.length) {
      previewStatus.className = 'preview-status';
      previewStatus.textContent = 'タンパク質が生産されています（蛍光タンパク質は未検出）。';
    } else {
      previewStatus.className = 'preview-status warn';
      previewStatus.textContent = '回路に遺伝子（タンパク質コーディング領域）がありません。';
    }

    previewChips.innerHTML = items.length
      ? items.map(it => '<span class="preview-chip">' + it.part.label + ': ' + it.Pss.toFixed(2) + '</span>').join('')
      : '<span class="preview-chip">なし</span>';

    previewChartWrap.innerHTML = items.length
      ? svgChart(items.map(it => it.arr), items.map((_, i) => CHART_PALETTE[i % CHART_PALETTE.length]))
      : '';
  }

  // ---------- Tabs ----------
  const TUTORIAL_STEPS = [

  function renderProtein(){
    const items = [];
    lastResults.forEach((r, ci) => r.genes.forEach((g, gi) => items.push({ chain: ci, gi, part: g.part, Pss: g.Pss, arr: g.arr })));
    if (items.length === 0) {

  // ---------- MD (Brownian Dynamics) particle simulation ----------
  // Complements the ODE (mean-field) simulation above with a stochastic, per-molecule
  // reaction-diffusion model (overdamped Langevin dynamics), using the SAME rate
  // constants (k_tx / k_tl / decay) so both views describe the same circuit.
  const MD_W = 560, MD_H = 300, MD_MARGIN = 18;
  const SPECIES_COLOR = {
    rnap: '#3f6fd6', ribosome: '#8e5cf7', mrna: '#f5a623',
    'gene-visible': '#39d98a', 'gene-repressor': '#ff7043', 'gene-activator': '#26c6da',
    'gene-recomb': '#a1887f', 'gene-kill': '#e53935'
  };
  const MD_D = { rnap: 4200, ribosome: 3000, mrna: 2600, protein: 3600 };
  const MD_RADIUS = { rnap: 4, ribosome: 5.5, mrna: 3.2, protein: 4 };
  const MD_BIND_R = 15, MD_REFRACTORY = 0.28, MD_KMD = 3;

  let mdParticles = [], mdPromoters = [], mdSimTime = 0, mdSeq = 0;
  let mdAnimHandle = null, mdRunning = false, mdDead = false;

  function gaussianRand(){
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  function randomMDParticle(type, x, y){
    return {
      id: 'm' + (mdSeq++), type,
      x: x != null ? x : MD_MARGIN + Math.random() * (MD_W - MD_MARGIN * 2),
      y: y != null ? y : MD_MARGIN + Math.random() * (MD_H - MD_MARGIN * 2),
      lastFire: -999, geneKind: null
    };
  }

  function initMDParticles(results){
    mdParticles = []; mdPromoters = []; mdSimTime = 0; mdDead = false;
    const innerH = MD_H - MD_MARGIN * 2;
    results.forEach((r, i) => {
      mdPromoters.push({
        id: 'prom' + i, chainIdx: i, x: MD_MARGIN + 46, y: MD_MARGIN + (innerH / (results.length + 1)) * (i + 1),
        kind: r.promKind, label: r.promLabel, genes: r.genes.map(g => g.part.kind), lastFire: -999
      });
    });
    for (let i = 0; i < 6; i++) mdParticles.push(randomMDParticle('rnap'));
    for (let i = 0; i < 6; i++) mdParticles.push(randomMDParticle('ribosome'));
  }

  function countLiveMD(pred){
    let n = 0;
    mdParticles.forEach(p => { if (pred(p)) n++; });
    return n;
  }

  function stepMD(dt){
    if (mdDead) return;
    mdSimTime += dt;
    const repressorCount = countLiveMD(p => p.type === 'protein' && p.geneKind === 'gene-repressor');
    const activatorCount = countLiveMD(p => p.type === 'protein' && p.geneKind === 'gene-activator');
    const killCount = countLiveMD(p => p.type === 'protein' && p.geneKind === 'gene-kill');
    if (killCount >= 5) { mdDead = true; return; }

    mdParticles.forEach(p => {
      const D = p.type === 'protein' ? MD_D.protein : MD_D[p.type];
      const sigma = Math.sqrt(2 * D * dt);
      p.x += gaussianRand() * sigma;
      p.y += gaussianRand() * sigma;
      if (p.x < MD_MARGIN) p.x = MD_MARGIN + (MD_MARGIN - p.x);
      if (p.x > MD_W - MD_MARGIN) p.x = (MD_W - MD_MARGIN) - (p.x - (MD_W - MD_MARGIN));
      if (p.y < MD_MARGIN) p.y = MD_MARGIN + (MD_MARGIN - p.y);
      if (p.y > MD_H - MD_MARGIN) p.y = (MD_H - MD_MARGIN) - (p.y - (MD_H - MD_MARGIN));
    });

    mdPromoters.forEach(prom => {
      if (mdSimTime - prom.lastFire < MD_REFRACTORY) return;
      let k_tx;
      if (prom.kind === 'prom-repressor') k_tx = 1.5 / (1 + Math.pow(repressorCount / MD_KMD, 2));
      else if (prom.kind === 'prom-activator') k_tx = 1.5 * (Math.pow(activatorCount, 2) / (Math.pow(MD_KMD, 2) + Math.pow(activatorCount, 2)));
      else k_tx = 1.5;
      const nearby = mdParticles.some(p => p.type === 'rnap' && Math.hypot(p.x - prom.x, p.y - prom.y) < MD_BIND_R);
      if (nearby && Math.random() < k_tx * dt) {
        prom.lastFire = mdSimTime;
        const mrna = randomMDParticle('mrna', prom.x + (Math.random() * 10 - 5), prom.y + (Math.random() * 10 - 5));
        mrna.genes = prom.genes;
        mdParticles.push(mrna);
      }
    });

    mdParticles.filter(p => p.type === 'ribosome').forEach(rib => {
      if (mdSimTime - rib.lastFire < MD_REFRACTORY) return;
      const target = mdParticles.find(p => p.type === 'mrna' && Math.hypot(p.x - rib.x, p.y - rib.y) < MD_BIND_R);
      if (target && Math.random() < K_TL * dt) {
        rib.lastFire = mdSimTime;
        const geneKind = target.genes[Math.floor(Math.random() * target.genes.length)];
        const prot = randomMDParticle('protein', rib.x + (Math.random() * 10 - 5), rib.y + (Math.random() * 10 - 5));
        prot.geneKind = geneKind;
        mdParticles.push(prot);
      }
    });

    mdParticles = mdParticles.filter(p => {
      if (p.type === 'mrna') return Math.random() >= DECAY_M * dt;
      if (p.type === 'protein') return Math.random() >= DECAY_P * dt;
      return true;
    });
  }

  function drawMD(){
    const canvas = document.getElementById('mdCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, MD_W, MD_H);

    const gfpCount = countLiveMD(p => p.type === 'protein' && p.geneKind === 'gene-visible');
    if (gfpCount > 0 && !mdDead) {
      const glow = Math.min(gfpCount / 10, 1);
      const grad = ctx.createRadialGradient(MD_W / 2, MD_H / 2, 10, MD_W / 2, MD_H / 2, MD_W / 1.4);
      grad.addColorStop(0, 'rgba(57,217,138,' + (0.12 + 0.25 * glow) + ')');
      grad.addColorStop(1, 'rgba(57,217,138,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, MD_W, MD_H);
    }

    ctx.strokeStyle = mdDead ? '#5a3a3a' : '#2d6b55';
    ctx.lineWidth = 2;
    ctx.strokeRect(MD_MARGIN / 2, MD_MARGIN / 2, MD_W - MD_MARGIN, MD_H - MD_MARGIN);

    mdPromoters.forEach(prom => {
      ctx.beginPath();
      ctx.arc(prom.x, prom.y, 7, 0, Math.PI * 2);
      ctx.fillStyle = '#274690';
      ctx.fill();
      ctx.fillStyle = '#cfe0ff';
      ctx.font = '10px sans-serif';
      ctx.fillText(prom.label, prom.x + 12, prom.y + 3);
    });

    mdParticles.forEach(p => {
      let color, r;
      if (p.type === 'protein') { color = SPECIES_COLOR[p.geneKind] || '#aaa'; r = MD_RADIUS.protein; }
      else { color = SPECIES_COLOR[p.type]; r = MD_RADIUS[p.type]; }
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.92;
      ctx.fill();
      ctx.globalAlpha = 1;
    });

    const overlay = document.getElementById('mdDeadOverlay');
    if (overlay) overlay.style.display = mdDead ? 'flex' : 'none';
    const statusEl = document.getElementById('mdStatus');
    if (statusEl) {
      statusEl.textContent = mdDead
        ? 'キルスイッチが作動し、細胞は死滅しました。'
        : '粒子数: ' + mdParticles.length + '（RNAP・リボソームは常駐、mRNA/タンパク質は生成と分解を繰り返します）';
    }
  }

  function mdLoop(){
    if (!mdRunning) return;
    stepMD(0.02);
    drawMD();
    mdAnimHandle = requestAnimationFrame(mdLoop);
  }
  function stopMD(){
    mdRunning = false;
    if (mdAnimHandle) cancelAnimationFrame(mdAnimHandle);
    mdAnimHandle = null;
  }
  function startMD(){
    if (mdRunning) return;
    mdRunning = true;
    mdLoop();
  }

  // ---------- 3D protein MD: coarse-grained (Cα-bead) Go-model, Langevin dynamics ----------
  // A real (if simplified/toy-scale) physics core: harmonic backbone (bond + 1-3 + 1-4
  // distance restraints), Go-model native contacts (Morse potential — can break under
  // heat), universal excluded-volume repulsion, a weak nonspecific collapse term, and
  // overdamped Langevin (friction + thermal noise) integration. NOT a literal amino-acid
  // structure — a simplified coarse-grained model, clearly labelled as such in the UI.
  const P3D_N = 32;
  const P3D_K_BOND = 80, P3D_K13 = 25, P3D_K14 = 8;
  const P3D_SIGMA_REP = 2.8, P3D_EPS_REP = 0.8;
  const P3D_EPS_NATIVE = 4.5, P3D_MORSE_A = 1.3;
  const P3D_F_CAP = 60, P3D_MAX_V = 25;
  const P3D_GAMMA = 3.0, P3D_DT = 0.006;
  const P3D_CUTOFF = 7.2;

  function p3dDist(a,b){ const dx=b.x-a.x, dy=b.y-a.y, dz=b.z-a.z; return Math.sqrt(dx*dx+dy*dy+dz*dz); }

  function p3dFoldBarrel(N){
    const radius=9.5, amplitude=8.0, strandsCount=6;
    const perStrand=N/strandsCount;
    const pos=[];
    for (let i=0;i<N;i++){
      const angle=(i/N)*Math.PI*2*(strandsCount/2);
      const phase=(i/perStrand)%2;
      const tri = phase<1 ? (phase*2-1) : (1-(phase-1)*2);
      pos.push({x:radius*Math.cos(angle), y:tri*amplitude, z:radius*Math.sin(angle)});
    }
    return pos;
  }
  function p3dFoldHelixBundle(N){
    const helices=3, perHelix=Math.floor(N/helices), packR=6.0;
    const pos=[]; let idx=0;
    for (let h=0; h<helices; h++){
      const cx=packR*Math.cos(h/helices*Math.PI*2), cz=packR*Math.sin(h/helices*Math.PI*2);
      const dir = h%2===0 ? 1 : -1;
      const count = h===helices-1 ? N-idx : perHelix;
      for (let k=0;k<count;k++){
        const t=k/count;
        const yy=dir*(t-0.5)*(count*1.6);
        const ha=k*100*Math.PI/180;
        pos.push({x:cx+2.6*Math.cos(ha), y:yy, z:cz+2.6*Math.sin(ha)});
        idx++;
      }
    }
    return pos.slice(0,N);
  }
  function p3dFoldGlobular(N){
    const pos=[], R=8.5, golden=Math.PI*(3-Math.sqrt(5));
    for (let i=0;i<N;i++){
      const t=i/(N-1), y=1-t*2, r=Math.sqrt(Math.max(0,1-y*y)), theta=golden*i;
      pos.push({x:R*r*Math.cos(theta), y:R*y, z:R*r*Math.sin(theta)});
    }
    return pos;
  }
  const P3D_FOLD_BY_KIND = {
    'gene-visible': p3dFoldBarrel,
    'gene-repressor': p3dFoldHelixBundle,
    'gene-activator': p3dFoldHelixBundle,
    'gene-recomb': p3dFoldGlobular,
    'gene-kill': p3dFoldGlobular
  };
  const P3D_FOLD_NAME = {
    'gene-visible': 'βバレル型（GFP様）', 'gene-repressor': 'ヘリックス束型（DNA結合様）',
    'gene-activator': 'ヘリックス束型（DNA結合様）', 'gene-recomb': 'コンパクト球状',
    'gene-kill': 'コンパクト球状'
  };

  function p3dTopology(native){
    const N=native.length;
    const bondLen=[]; for (let i=0;i<N-1;i++) bondLen.push(p3dDist(native[i],native[i+1]));
    const d13=[]; for (let i=0;i<N-2;i++) d13.push(p3dDist(native[i],native[i+2]));
    const d14=[]; for (let i=0;i<N-3;i++) d14.push(p3dDist(native[i],native[i+3]));
    const contacts=[];
    for (let i=0;i<N;i++) for (let j=i+4;j<N;j++){
      const d=p3dDist(native[i],native[j]);
      if (d<P3D_CUTOFF) contacts.push({i,j,d0:d});
    }
    let cx=0,cy=0,cz=0; native.forEach(p=>{cx+=p.x;cy+=p.y;cz+=p.z;}); cx/=N;cy/=N;cz/=N;
    let s=0; native.forEach(p=>{s+=(p.x-cx)**2+(p.y-cy)**2+(p.z-cz)**2;});
    return { bondLen, d13, d14, contacts, N, nativeRg: Math.sqrt(s/N) };
  }

  function p3dJitter(native, amount){
    return native.map(p => ({
      x: p.x + (Math.random()-0.5)*amount,
      y: p.y + (Math.random()-0.5)*amount,
      z: p.z + (Math.random()-0.5)*amount
    }));
  }
  function p3dExtendedChain(N, bondLen){
    const pos=[{x:0,y:0,z:0}];
    let d={x:1,y:0.2,z:0};
    const norm=v=>{const n=Math.hypot(v.x,v.y,v.z)||1e-9; v.x/=n;v.y/=n;v.z/=n; return v;};
    norm(d);
    for (let i=1;i<N;i++){
      d.x+=(Math.random()-0.5)*0.9; d.y+=(Math.random()-0.5)*0.9; d.z+=(Math.random()-0.5)*0.9;
      norm(d);
      const b=bondLen[i-1], prev=pos[i-1];
      pos.push({x:prev.x+d.x*b, y:prev.y+d.y*b, z:prev.z+d.z*b});
    }
    return pos;
  }

  function p3dCap(f){ return Math.max(-P3D_F_CAP, Math.min(P3D_F_CAP, f)); }

  function p3dForces(pos, topo){
    const N=pos.length;
    const F=pos.map(()=>({x:0,y:0,z:0}));
    function spring(i,j,r0,k){
      const a=pos[i], b=pos[j];
      const dx=b.x-a.x, dy=b.y-a.y, dz=b.z-a.z;
      const r=Math.sqrt(dx*dx+dy*dy+dz*dz)||1e-6;
      const fmag=p3dCap(k*(r-r0)/r);
      const fx=fmag*dx, fy=fmag*dy, fz=fmag*dz;
      F[i].x+=fx; F[i].y+=fy; F[i].z+=fz;
      F[j].x-=fx; F[j].y-=fy; F[j].z-=fz;
    }
    for (let i=0;i<N-1;i++) spring(i,i+1,topo.bondLen[i],P3D_K_BOND);
    for (let i=0;i<N-2;i++) spring(i,i+2,topo.d13[i],P3D_K13);
    for (let i=0;i<N-3;i++) spring(i,i+3,topo.d14[i],P3D_K14);

    topo.contacts.forEach(c => {
      const a=pos[c.i], b=pos[c.j];
      const dx=b.x-a.x, dy=b.y-a.y, dz=b.z-a.z;
      const r=Math.sqrt(dx*dx+dy*dy+dz*dz)||1e-6;
      const ex=Math.exp(-P3D_MORSE_A*(r-c.d0));
      const dUdr=2*P3D_EPS_NATIVE*P3D_MORSE_A*ex*(1-ex);
      const fmag=p3dCap(-dUdr/r);
      const fx=fmag*dx, fy=fmag*dy, fz=fmag*dz;
      F[c.i].x+=fx; F[c.i].y+=fy; F[c.i].z+=fz;
      F[c.j].x-=fx; F[c.j].y-=fy; F[c.j].z-=fz;
    });

    for (let i=0;i<N;i++){
      for (let j=i+3;j<N;j++){
        const a=pos[i], b=pos[j];
        const dx=b.x-a.x, dy=b.y-a.y, dz=b.z-a.z;
        const r2=dx*dx+dy*dy+dz*dz;
        if (r2 < P3D_SIGMA_REP*P3D_SIGMA_REP){
          const r=Math.sqrt(r2)||1e-6;
          const sr6=Math.pow(P3D_SIGMA_REP/r,6), sr12=sr6*sr6;
          const fmag=p3dCap(12*P3D_EPS_REP*sr12/r/r);
          const fx=fmag*dx, fy=fmag*dy, fz=fmag*dz;
          F[i].x-=fx; F[i].y-=fy; F[i].z-=fz;
          F[j].x+=fx; F[j].y+=fy; F[j].z+=fz;
        }
      }
    }

    let cx=0,cy=0,cz=0;
    for (let i=0;i<N;i++){ cx+=pos[i].x; cy+=pos[i].y; cz+=pos[i].z; }
    cx/=N; cy/=N; cz/=N;
    let rgNow=0;
    for (let i=0;i<N;i++) rgNow += (pos[i].x-cx)**2+(pos[i].y-cy)**2+(pos[i].z-cz)**2;
    rgNow=Math.sqrt(rgNow/N);
    const excess=Math.max(0, rgNow - topo.nativeRg*1.8);
    const kConf=0.55*Math.min(1, excess/(topo.nativeRg*0.5));
    if (kConf>0){
      for (let i=0;i<N;i++){
        F[i].x += kConf*(cx-pos[i].x);
        F[i].y += kConf*(cy-pos[i].y);
        F[i].z += kConf*(cz-pos[i].z);
      }
    }
    return F;
  }

  function p3dRg(pos){
    const N=pos.length; let cx=0,cy=0,cz=0;
    pos.forEach(p=>{cx+=p.x;cy+=p.y;cz+=p.z;}); cx/=N;cy/=N;cz/=N;
    let s=0; pos.forEach(p=>{s+=(p.x-cx)**2+(p.y-cy)**2+(p.z-cz)**2;});
    return Math.sqrt(s/N);
  }
  function p3dQ(pos, topo){
    if (topo.contacts.length===0) return 1;
    let formed=0;
    topo.contacts.forEach(c=>{ if (p3dDist(pos[c.i],pos[c.j]) < c.d0*1.2) formed++; });
    return formed/topo.contacts.length;
  }

  // ---------- Three.js scene (created once, reused across tab/mode switches) ----------
  let p3dScene=null, p3dCamera=null, p3dRenderer=null, p3dBeadMeshes=[], p3dBondMeshes=[];
  let p3dOrbit={theta:0.9, phi:1.1, dist:34, target:{x:0,y:0,z:0}};
  let p3dDragging=false, p3dLastPointer=null;
  let p3dGeneKind=null, p3dNative=null, p3dTopo=null, p3dPos=null, p3dVel=null;
  let p3dAnimHandle=null, p3dRunning=false, p3dKT=15;

  function ensureThreeScene(mountEl){
    if (typeof THREE === 'undefined') return false;
    if (!p3dRenderer){
      p3dScene = new THREE.Scene();
      p3dCamera = new THREE.PerspectiveCamera(45, 560/380, 0.1, 500);
      p3dRenderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
      p3dRenderer.setSize(560, 380, false);
      p3dScene.add(new THREE.AmbientLight(0xffffff, 0.55));
      const dl = new THREE.DirectionalLight(0xffffff, 0.9); dl.position.set(20,30,25); p3dScene.add(dl);
      const dl2 = new THREE.DirectionalLight(0x88bbff, 0.35); dl2.position.set(-20,-10,-15); p3dScene.add(dl2);
      p3dScene.background = new THREE.Color(0x0a1512);

      p3dRenderer.domElement.addEventListener('pointerdown', e => {
        p3dDragging = true; p3dLastPointer = { x:e.clientX, y:e.clientY };
      });
      window.addEventListener('pointermove', e => {
        if (!p3dDragging) return;
        const dx = e.clientX - p3dLastPointer.x, dy = e.clientY - p3dLastPointer.y;
        p3dLastPointer = { x:e.clientX, y:e.clientY };
        p3dOrbit.theta -= dx*0.008;
        p3dOrbit.phi = Math.max(0.15, Math.min(Math.PI-0.15, p3dOrbit.phi - dy*0.008));
      });
      window.addEventListener('pointerup', () => { p3dDragging = false; });
      p3dRenderer.domElement.addEventListener('wheel', e => {
        e.preventDefault();
        p3dOrbit.dist = Math.max(14, Math.min(90, p3dOrbit.dist + e.deltaY*0.03));
      }, { passive:false });
    }
    if (mountEl && p3dRenderer.domElement.parentElement !== mountEl){
      mountEl.appendChild(p3dRenderer.domElement);
    }
    return true;
  }

  function rebuildP3dMeshes(N){
    p3dBeadMeshes.forEach(m => p3dScene.remove(m));
    p3dBondMeshes.forEach(m => p3dScene.remove(m));
    p3dBeadMeshes = []; p3dBondMeshes = [];
    const sphGeo = new THREE.SphereGeometry(0.62, 14, 10);
    for (let i=0;i<N;i++){
      const hue = (i/(N-1)) * 0.66; // spectrum: blue(N-term) -> red(C-term), classic convention
      const color = new THREE.Color().setHSL(0.66 - hue, 0.75, 0.55);
      const mat = new THREE.MeshStandardMaterial({ color, roughness:0.45, metalness:0.05 });
      const mesh = new THREE.Mesh(sphGeo, mat);
      p3dScene.add(mesh);
      p3dBeadMeshes.push(mesh);
    }
    const cylGeo = new THREE.CylinderGeometry(0.22, 0.22, 1, 8, 1);
    for (let i=0;i<N-1;i++){
      const mat = new THREE.MeshStandardMaterial({ color:0xbfcfd8, roughness:0.6 });
      const mesh = new THREE.Mesh(cylGeo, mat);
      p3dScene.add(mesh);
      p3dBondMeshes.push(mesh);
    }
  }

  function initProtein3D(geneKind){
    p3dGeneKind = geneKind;
    const foldFn = P3D_FOLD_BY_KIND[geneKind] || p3dFoldGlobular;
    p3dNative = foldFn(P3D_N);
    p3dTopo = p3dTopology(p3dNative);
    p3dPos = p3dJitter(p3dNative, 2.0);
    p3dVel = p3dPos.map(()=>({x:0,y:0,z:0}));
    if (p3dScene) rebuildP3dMeshes(P3D_N);
  }

  function unfoldProtein3D(){
    if (!p3dTopo) return;
    p3dPos = p3dExtendedChain(P3D_N, p3dTopo.bondLen);
    p3dVel = p3dPos.map(()=>({x:0,y:0,z:0}));
  }

  function stepProtein3D(substeps){
    for (let s=0;s<substeps;s++){
      const F = p3dForces(p3dPos, p3dTopo);
      for (let i=0;i<P3D_N;i++){
        const noiseScale = Math.sqrt(2*P3D_GAMMA*p3dKT*P3D_DT);
        ['x','y','z'].forEach(ax => {
          p3dVel[i][ax] += (F[i][ax] - P3D_GAMMA*p3dVel[i][ax])*P3D_DT + noiseScale*gaussianRand();
          p3dVel[i][ax] = Math.max(-P3D_MAX_V, Math.min(P3D_MAX_V, p3dVel[i][ax]));
          p3dPos[i][ax] += p3dVel[i][ax]*P3D_DT;
        });
      }
    }
  }

  function renderProtein3DFrame(){
    if (!p3dRenderer || !p3dPos) return;
    for (let i=0;i<P3D_N;i++){
      p3dBeadMeshes[i].position.set(p3dPos[i].x, p3dPos[i].y, p3dPos[i].z);
    }
    for (let i=0;i<P3D_N-1;i++){
      const a=p3dPos[i], b=p3dPos[i+1];
      const mid = new THREE.Vector3((a.x+b.x)/2, (a.y+b.y)/2, (a.z+b.z)/2);
      const dir = new THREE.Vector3(b.x-a.x, b.y-a.y, b.z-a.z);
      const len = dir.length();
      const mesh = p3dBondMeshes[i];
      mesh.position.copy(mid);
      mesh.scale.set(1, len, 1);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
    }

    const cx = p3dOrbit.dist*Math.sin(p3dOrbit.phi)*Math.cos(p3dOrbit.theta);
    const cy = p3dOrbit.dist*Math.cos(p3dOrbit.phi);
    const cz = p3dOrbit.dist*Math.sin(p3dOrbit.phi)*Math.sin(p3dOrbit.theta);
    p3dCamera.position.set(cx,cy,cz);
    p3dCamera.lookAt(0,0,0);
    p3dRenderer.render(p3dScene, p3dCamera);

    const rg = p3dRg(p3dPos), q = p3dQ(p3dPos, p3dTopo);
    const rgEl = document.getElementById('p3dRg'), qEl = document.getElementById('p3dQ');
    if (rgEl) rgEl.textContent = 'Rg = ' + rg.toFixed(2) + '（天然状態 ' + p3dTopo.nativeRg.toFixed(2) + '）';
    if (qEl) qEl.textContent = 'Q（天然コンタクト率） = ' + (q*100).toFixed(0) + '%';
  }

  function p3dLoop(){
    if (!p3dRunning) return;
    stepProtein3D(4);
    renderProtein3DFrame();
    p3dAnimHandle = requestAnimationFrame(p3dLoop);
  }
  function stopProtein3D(){
    p3dRunning = false;
    if (p3dAnimHandle) cancelAnimationFrame(p3dAnimHandle);
    p3dAnimHandle = null;
  }
  function startProtein3D(){
    if (p3dRunning) return;
    p3dRunning = true;
    p3dLoop();
  }

  function renderMDProtein3D(){
    const host = document.getElementById('mdModeHost');
    const geneKinds = [...new Set(lastResults.flatMap(r => r.genes.map(g => g.part.kind)))];
    if (geneKinds.length === 0){
      host.innerHTML = '<div class="empty-note">回路に遺伝子（タンパク質コーディング領域）がありません。</div>';
      return;
    }
    if (!geneKinds.includes(p3dGeneKind)) p3dGeneKind = geneKinds[0];
    const geneLabel = k => (lastResults.flatMap(r=>r.genes).find(g=>g.part.kind===k) || {}).part?.label || k;

    host.innerHTML =
      '<div class="md-wrap">' +
        '<div class="md-desc">各遺伝子の産物を、アミノ酸1残基=1粒子(Cα)に簡略化した粗視化モデルとして3D表示します。バネ(結合・局所剛性)＋天然コンタクト(Go模型・モース型ポテンシャル)＋排除体積＋ランジュバン熱浴、という実在のMD手法の縮小版です。<b>実際のアミノ酸配列ではなく、簡略化した仮想の構造</b>です。ドラッグで回転、ホイールでズームできます。</div>' +
        '<div class="p3d-protein-select" id="p3dSelect"></div>' +
        '<div class="p3d-shell">' +
          '<div class="p3d-mount" id="p3dMount"></div>' +
          '<div class="p3d-hint">🖱️ ドラッグで回転 / ホイールでズーム</div>' +
        '</div>' +
        '<div class="p3d-controls">' +
          '<div class="p3d-row"><label>🌡️ 温度</label><input type="range" id="p3dTemp" min="1" max="160" value="' + p3dKT + '"><span id="p3dTempVal">' + p3dKT + '</span></div>' +
          '<button id="p3dResetBtn">🔄 折りたたみ直す</button>' +
          '<button id="p3dUnfoldBtn">🌀 変性させる（伸ばす）</button>' +
        '</div>' +
        '<div class="p3d-readouts">' +
          '<span class="chip" id="p3dRg">Rg = —</span>' +
          '<span class="chip" id="p3dQ">Q = —</span>' +
        '</div>' +
        '<div class="p3d-note">低温では天然構造付近で揺らぎ、温度を上げるとGo模型コンタクトが熱で切れて構造が崩れます（Rg上昇・Q低下）。Q・Rgは分子動力学で実際に使われる標準的な構造指標です。</div>' +
      '</div>';

    const selectHost = document.getElementById('p3dSelect');
    geneKinds.forEach(k => {
      const btn = document.createElement('button');
      btn.textContent = geneLabel(k) + '（' + (P3D_FOLD_NAME[k] || 'コンパクト球状') + '）';
      btn.className = k === p3dGeneKind ? 'active' : '';
      btn.addEventListener('click', () => {
        p3dGeneKind = k;
        initProtein3D(p3dGeneKind);
        renderMDProtein3D();
      });
      selectHost.appendChild(btn);
    });

    const mount = document.getElementById('p3dMount');
    const ok = ensureThreeScene(mount);
    if (!ok){
      host.innerHTML += '<div class="empty-note">⚠️ 3D描画ライブラリ(Three.js)を読み込めませんでした。インターネット接続を確認してください。</div>';
      return;
    }
    if (!p3dPos) initProtein3D(p3dGeneKind);

    document.getElementById('p3dTemp').addEventListener('input', e => {
      p3dKT = Number(e.target.value);
      document.getElementById('p3dTempVal').textContent = p3dKT;
    });
    document.getElementById('p3dResetBtn').addEventListener('click', () => { initProtein3D(p3dGeneKind); });
    document.getElementById('p3dUnfoldBtn').addEventListener('click', () => { unfoldProtein3D(); });

    startProtein3D();
    renderProtein3DFrame();
  }

  let mdMode = 'cell';

  function renderMD(){
    if (lastResults.length === 0) {
      tabContent.innerHTML = '<div class="empty-note">まだ回路がありません。回路を組んで「実行」を押すと、分子シミュレーションを表示します。</div>';
      return;
    }
    tabContent.innerHTML =
      '<div class="md-mode-toggle">' +
        '<button class="md-mode-btn ' + (mdMode === 'cell' ? 'active' : '') + '" id="mdModeCellBtn">🧫 細胞内シミュレーション（2D）</button>' +
        '<button class="md-mode-btn ' + (mdMode === 'protein3d' ? 'active' : '') + '" id="mdModeP3dBtn">🧬 タンパク質構造MD（3D）</button>' +
      '</div>' +
      '<div id="mdModeHost"></div>';
    document.getElementById('mdModeCellBtn').addEventListener('click', () => { if (mdMode !== 'cell') { stopProtein3D(); mdMode = 'cell'; renderMD(); } });
    document.getElementById('mdModeP3dBtn').addEventListener('click', () => { if (mdMode !== 'protein3d') { stopMD(); mdMode = 'protein3d'; renderMD(); } });

    if (mdMode === 'cell') renderMDCell();
    else renderMDProtein3D();
  }

  function renderMDCell(){
    const host = document.getElementById('mdModeHost');
    const hasGene = kind => lastResults.some(r => r.genes.some(g => g.part.kind === kind));
    host.innerHTML =
      '<div class="md-wrap">' +
        '<div class="md-desc">プロモーターに結合したRNAポリメラーゼがmRNAを、mRNAに結合したリボソームがタンパク質を確率的に生成します（過減衰ランジュバン方程式によるブラウン動力学）。上のODEシミュレーションと同じ速度定数(k_tx・k_tl・分解速度)を使い、リプレッサー/アクチベータータンパク質の実際の粒子数に応じて転写確率がその場で変化します。</div>' +
        '<div class="md-canvas-shell">' +
          '<canvas id="mdCanvas" width="' + MD_W + '" height="' + MD_H + '"></canvas>' +
          '<div class="md-dead-overlay" id="mdDeadOverlay">💀 細胞死<small>キルスイッチ遺伝子が発現しました</small></div>' +
        '</div>' +
        '<div class="md-controls">' +
          '<button id="mdResetBtn">🔄 粒子をリセット</button>' +
          '<span class="md-status" id="mdStatus"></span>' +
        '</div>' +
        '<div class="md-legend">' +
          '<span><i style="background:#3f6fd6"></i>RNAポリメラーゼ</span>' +
          '<span><i style="background:#8e5cf7"></i>リボソーム</span>' +
          '<span><i style="background:#f5a623"></i>mRNA</span>' +
          '<span><i style="background:#274690"></i>プロモーター部位</span>' +
          (hasGene('gene-visible') ? '<span><i style="background:#39d98a"></i>GFP</span>' : '') +
          (hasGene('gene-repressor') ? '<span><i style="background:#ff7043"></i>リプレッサー</span>' : '') +
          (hasGene('gene-activator') ? '<span><i style="background:#26c6da"></i>アクチベーター</span>' : '') +
          (hasGene('gene-recomb') ? '<span><i style="background:#a1887f"></i>リコンビナーゼ</span>' : '') +
          (hasGene('gene-kill') ? '<span><i style="background:#e53935"></i>キルスイッチ</span>' : '') +
        '</div>' +
      '</div>';
    document.getElementById('mdResetBtn').addEventListener('click', () => { initMDParticles(lastResults); });
    startMD();
    drawMD();
  }

  function refreshActiveTab(){
    if (activeTab === 'tutorial') renderTutorial();
    else if (activeTab === 'protein') renderProtein();
    else if (activeTab === 'rna') renderRna();
    else if (activeTab === 'md') renderMD();
    else if (activeTab === 'questions') renderQuestions();
    else if (activeTab === 'load') renderLoad();
  }

  tabsBar.querySelectorAll('.tab-item').forEach(el => {
    el.addEventListener('click', () => {
      if (activeTab === 'md' && el.dataset.tab !== 'md') { stopMD(); stopProtein3D(); }
      tabsBar.querySelectorAll('.tab-item').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      activeTab = el.dataset.tab;
      refreshActiveTab();
    });
  });

  function loadDemoCircuit(){
    blocks.forEach(b => b.el.remove());
    blocks.clear();
    const b1 = createPlaced('promConst1', 60, 140);
    const b2 = createPlaced('visiFluorescence', 60, 140);
    const b3 = createPlaced('term1', 60, 140);
    b1.next = b2.id; b2.prev = b1.id;
    b2.next = b3.id; b3.prev = b2.id;
    positionGroup([b1.id, b2.id, b3.id], 60, 140);
    updateHint();
    rightPanel.classList.remove('show');
    toggleRight.textContent = 'Lab を表示';
  }

  previewBacterium.src = BACT_IMG;
  renderTutorial();
  updateHint();
})();
</script>
